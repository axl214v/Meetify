<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Meetify</title>
    <meta name="description" content="Sign in to Meetify to create or join private video rooms in your browser.">
    <link rel="canonical" href="https://meetify.cc/auth/Auth.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Meetify">
    <meta property="og:title" content="Sign in — Meetify">
    <meta property="og:description" content="Sign in to Meetify to create or join private video rooms in your browser.">
    <meta property="og:url" content="https://meetify.cc/auth/Auth.html">
    <meta property="og:image" content="https://meetify.cc/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sign in — Meetify">
    <meta name="twitter:description" content="Sign in to Meetify to create or join private video rooms in your browser.">
    <meta name="twitter:image" content="https://meetify.cc/assets/og-image.png">
    <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('meetify-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}d.setAttribute('data-theme',t)})();</script>
    <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/auth.css">
    <link rel="icon" href="/assets/logo-mark.png">
</head>
<body>
    <header class="auth-top">
        <a class="brand" href="/" aria-label="Meetify home"><img src="/assets/logo.png" alt="Meetify" width="114" height="28"></a>
        <button class="btn btn-ghost btn-icon btn-sm" id="themeToggleBtn" data-static type="button" aria-label="Switch theme"><svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
    </header>

    <main class="auth-main">
        <div class="auth-stage glow">
        <section class="auth-panel panel">
            <h1>Sign in</h1>
            <p class="auth-sub">Use your Meetify account to create or join rooms.</p>
            <form class="auth-form" onsubmit="return false" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" placeholder="you@example.com" maxlength="100" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" placeholder="" maxlength="100" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary btn-lg" id="submit" type="button">Sign in</button>
                <div class="auth-message" id="authMessage" role="alert"></div>
            </form>
            <div class="auth-foot">
                <span>No account yet? <a href="/auth/Reg.html">Create account</a></span>
                <a href="/auth/resetpass.html">Forgot password?</a>
            </div>
        </section>
        </div>
    </main>

    <footer class="auth-legal">
        <a href="/legal/terms.html">Terms</a>
        <a href="/legal/privacy.html">Privacy</a>
    </footer>

    <script src="/js/theme.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/err/error-logger.js"></script>
</body>
</html>
