<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email — Meetify</title>
    <meta name="robots" content="noindex, nofollow">
    <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('meetify-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}d.setAttribute('data-theme',t)})();</script>
    <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/auth.css">
    <link rel="icon" href="/assets/logo-mark.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#06080d">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="/js/i18n.js"></script>
</head>
<body>
    <header class="auth-top">
        <a data-i18n-attr="aria-label" class="brand" href="/" aria-label="Meetify home"><picture><source media="(max-width: 480px)" srcset="/assets/logo-mark.png"><img src="/assets/logo.png" alt="Meetify" width="114" height="28"></picture></a>
        <button data-i18n-attr="aria-label" class="btn btn-ghost btn-icon btn-sm" id="themeToggleBtn" data-static type="button" aria-label="Switch theme"><svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
    </header>

    <main class="auth-main">
        <div class="auth-stage glow">
        <section class="auth-panel panel">

            <div id="stateLoading">
                <h1 data-i18n>Verifying your email</h1>
                <p data-i18n class="auth-sub">One moment.</p>
                <div data-i18n-attr="aria-label" class="spinner" role="status" aria-label="Loading"></div>
            </div>

            <div id="stateSuccess" style="display:none">
                <div class="state-icon ok" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
                <h1 data-i18n>Email verified</h1>
                <p data-i18n class="auth-sub">Your email is confirmed. You can now create and join rooms.</p>
                <div class="auth-form"><a data-i18n class="btn btn-primary btn-lg" href="/Conf/pages/conf.html">Go to conferences</a></div>
            </div>

            <div id="stateError" style="display:none">
                <div class="state-icon bad" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
                <h1 data-i18n>Verification failed</h1>
                <p data-i18n class="auth-sub" id="errorText">The link is invalid or has expired.</p>
                <form class="auth-form" id="resendForm" style="display:none" onsubmit="return false" novalidate>
                    <div class="field">
                        <label data-i18n for="resendEmail">Email for a new link</label>
                        <input class="input" type="email" id="resendEmail" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <button data-i18n class="btn btn-primary btn-lg" id="resendBtn" type="button">Resend verification email</button>
                    <div class="auth-message" id="resendMessage" role="alert"></div>
                </form>
                <div class="auth-foot"><a data-i18n href="/auth/Auth.html">Back to sign in</a></div>
            </div>

            <div id="stateAlready" style="display:none">
                <div class="state-icon ok" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
                <h1 data-i18n>Already verified</h1>
                <p data-i18n class="auth-sub">Your email is already confirmed.</p>
                <div class="auth-form"><a data-i18n class="btn btn-primary btn-lg" href="/Conf/pages/conf.html">Go to conferences</a></div>
            </div>

        </section>
        </div>
    </main>

    <footer class="auth-legal">
        <a data-i18n href="/legal/terms.html">Terms</a>
        <a data-i18n href="/legal/privacy.html">Privacy</a>
    </footer>

    <script src="/js/theme.js"></script>
    <script src="/js/verify-email.js"></script>
    <script src="/err/error-logger.js"></script>
</body>
</html>
