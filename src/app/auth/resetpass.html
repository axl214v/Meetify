<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Meetify</title>
    <meta name="robots" content="noindex, nofollow">
    <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('meetify-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}d.setAttribute('data-theme',t)})();</script>
    <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/auth.css">
    <link rel="icon" href="/assets/logo-mark.png">
</head>
<body>
    <header class="auth-top">
        <a class="brand" href="/" aria-label="Meetify home"><img src="/assets/logo.png" alt="Meetify" width="114" height="28"></a>
        <button class="btn btn-ghost btn-icon btn-sm" id="themeToggleBtn" data-static type="button" aria-label="Switch theme"><svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
    </header>

    <main class="auth-main">
        <div class="auth-stage glow">
        <section class="auth-panel panel">
            <h1>Reset password</h1>
            <p class="auth-sub">Enter your email and we will send you a reset link.</p>
            <form class="auth-form" id="requestForm" onsubmit="return false" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input class="input" type="email" id="email" name="email" placeholder="you@example.com" maxlength="100" autocomplete="email" required>
                </div>
                <button class="btn btn-primary btn-lg" id="submitBtn" type="button">Send reset link</button>
                <div class="auth-message" id="resetMessage" role="alert"></div>
            </form>

            <div id="successBlock" style="display:none;">
                <div style="margin-top: var(--space-5);">
                    <div class="state-icon " aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg></div>
                    <h2 style="font-size: var(--text-md);">Check your email</h2>
                    <p class="auth-sub">If <strong id="sentToEmail" style="color: var(--text);">-</strong> is registered, a reset link is on its way. It expires in 1 hour. Check your spam folder if you do not see it.</p>
                </div>
            </div>

            <div class="auth-foot">
                <span>Remembered it? <a href="/auth/Auth.html">Sign in</a></span>
            </div>
        </section>
        </div>
    </main>

    <footer class="auth-legal">
        <a href="/legal/terms.html">Terms</a>
        <a href="/legal/privacy.html">Privacy</a>
    </footer>

    <script src="/js/theme.js"></script>
    <script src="/js/resetpass.js"></script>
    <script src="/err/error-logger.js"></script>
</body>
</html>
