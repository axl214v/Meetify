<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support — Meetify</title>
    <meta name="robots" content="noindex, nofollow">
    <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('meetify-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}d.setAttribute('data-theme',t)})();</script>
    <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/app.css">
    <link rel="icon" href="/assets/logo-mark.png">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="/" aria-label="Meetify home"><img src="/assets/logo.png" alt="Meetify" width="106" height="26"></a>
            <nav class="topbar-nav" aria-label="Primary">
                <a class="nav-link" href="/Conf/pages/conf.html">Conferences</a>
                <a class="nav-link" href="/Conf/pages/conf_join.html">Join a room</a>
                <a class="nav-link" href="/profile/profile.html">Profile</a>
                <a class="nav-link" href="/support/support.html" aria-current="page">Support</a>
            </nav>
            <span class="topbar-spacer"></span>
            <span class="topbar-user" id="userName"></span>
            <button class="btn btn-ghost btn-icon btn-sm" id="themeToggleBtn" data-static type="button" aria-label="Switch theme"><svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
        </div>
    </header>

    <main class="container page">
        <div class="panel state" id="authWall" style="display:none">
            <h3>Sign in to use support</h3>
            <p>Create and follow your support tickets after signing in.</p>
            <div class="state-actions"><a class="btn btn-primary" href="/auth/Auth.html">Sign in</a></div>
        </div>

        <div id="ticketsView" style="display:none">
            <div class="page-head">
                <div>
                    <h1>Support</h1>
                    <p>Your tickets and our replies.</p>
                </div>
                <button class="btn btn-primary" id="btnNewTicket" type="button">New ticket</button>
            </div>

            <div class="panel form-panel form-card" id="formCard" style="margin-bottom: var(--space-5);">
                <div class="form-stack">
                    <h2 style="font-size: var(--text-md);">New ticket</h2>
                    <div class="field"><label for="fTitle">Title</label><input class="input" type="text" id="fTitle" placeholder="Short description of the problem" maxlength="255"></div>
                    <div class="field"><label for="fCategory">Category</label>
                        <select class="select" id="fCategory">
                            <option value="technical">Technical problem</option>
                            <option value="account">Account</option>
                            <option value="general">General question</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="field"><label for="fMessage">Message</label><textarea class="textarea" id="fMessage" placeholder="What happened, and what did you expect?" maxlength="5000" rows="5"></textarea></div>
                    <div class="form-actions">
                        <button class="btn btn-primary" id="btnSubmitForm" type="button">Submit ticket</button>
                        <button class="btn" id="btnCancelForm" type="button">Cancel</button>
                    </div>
                </div>
            </div>

            <div class="panel conf-list" id="ticketList"><p class="muted-pad">Loading...</p></div>
        </div>
    </main>

    <footer class="app-foot">&copy; 2026 Meetify</footer>

    <script src="/js/theme.js"></script>
    <script src="/Conf/js/conf_utils.js"></script>
    <script src="/support/support.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/notifications.js"></script>
</body>
</html>
