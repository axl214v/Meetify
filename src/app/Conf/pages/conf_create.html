<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Conference - Meetify</title>
    <meta name="robots" content="noindex, nofollow">
    <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('meetify-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}d.setAttribute('data-theme',t)})();</script>
    <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/app.css">
    <link rel="icon" href="/assets/logo-mark.png">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="/" aria-label="Meetify home"><img src="/assets/logo.png" alt="Meetify" width="106" height="26"></a>
            <nav class="topbar-nav" aria-label="Primary">
                <a class="nav-link" href="/Conf/pages/conf.html">Conferences</a>
                <a class="nav-link" href="/Conf/pages/conf_join.html">Join a room</a>
                <a class="nav-link" href="/profile/profile.html">Profile</a>
            </nav>
            <span class="topbar-spacer"></span>
            <span class="topbar-user" id="userName"></span>
            <button class="btn btn-ghost btn-icon btn-sm" id="themeToggleBtn" data-static type="button" aria-label="Switch theme"><svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
        </div>
    </header>

    <main class="container page page-narrow">
        <div class="page-head">
            <div>
                <h1>Create room</h1>
                <p>Choose how the call runs, then share the room ID.</p>
            </div>
        </div>

        <div class="panel form-panel">
            <form id="createConferenceForm" class="form-stack" novalidate>
                <div class="field">
                    <span class="label-like" style="font-size: var(--text-sm); font-weight: 500;">Call type</span>
                    <div class="mode-cards">
                        <label class="mode-card mode-card--active" id="modeCardP2p">
                            <input type="radio" name="mode" id="modeP2p" value="p2p" checked hidden>
                            <span class="mode-card-title">Private call</span>
                            <span class="mode-card-desc">Peer-to-peer, up to 8 people. Audio and video go directly between browsers, not through our server.</span>
                        </label>
                        <label class="mode-card" id="modeCardSfu">
                            <input type="radio" name="mode" id="modeSfu" value="sfu" hidden>
                            <span class="mode-card-title">Group call</span>
                            <span class="mode-card-desc">Up to 100 people. Media is routed through our server so large calls stay smooth.</span>
                        </label>
                    </div>
                </div>

                    <div class="field">
                        <label for="name">Name</label>
                        <input class="input" type="text" id="name" name="name" placeholder="Team sync" maxlength="255" required>
                    </div>

                <div class="field">
                    <label for="description">Description</label>
                    <textarea class="textarea" id="description" name="description" placeholder="Optional" maxlength="1000" rows="3"></textarea>
                </div>

                    <div class="field">
                        <label for="maxParticipants">Max participants</label>
                        <input class="input" type="number" id="maxParticipants" name="maxParticipants" placeholder="Unlimited" min="2" max="1000">
                    </div>

                <div class="form-section">
                    <h2>Access</h2>
                    <label class="check"><input type="checkbox" id="isPublic" checked> Show in the public conference list</label>
                    <label class="check"><input type="checkbox" id="requirePassword"> Require a password to join</label>
                    <div class="field" id="passwordField" style="display: none;">
                        <label for="password">Password</label>
                        <input class="input" type="password" id="password" name="password" placeholder="At least 4 characters" minlength="4">
                    </div>
                </div>

                <div class="form-section">
                    <h2>Schedule (optional)</h2>
                    <div class="form-row">
                        <div class="field"><label for="startTime">Start time</label><input class="input" type="datetime-local" id="startTime" name="startTime"></div>
                        <div class="field"><label for="endTime">End time</label><input class="input" type="datetime-local" id="endTime" name="endTime"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Create room</button>
                    <button type="button" class="btn btn-lg" id="cancelBtn">Cancel</button>
                </div>
            </form>

            <div id="conferenceInfo" class="message ok created" style="display: none;">
                <p>Room created. ID: <strong class="mono" id="conferenceId"></strong></p>
                <button type="button" class="btn btn-sm" id="copyBtn" style="margin-top: var(--space-2);">Copy ID</button>
            </div>
        </div>
    </main>

    <footer class="app-foot">&copy; 2026 Meetify</footer>

    <script src="/js/theme.js"></script>
    <script src="/Conf/js/conf_utils.js"></script>
    <script src="/Conf/js/conf_create.js"></script>
    <script src="/err/error-logger.js"></script>
</body>
</html>
