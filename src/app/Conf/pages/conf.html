<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Conferences - Meetify</title>
    <meta name="robots" content="noindex, nofollow">
    <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('meetify-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}d.setAttribute('data-theme',t)})();</script>
    <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/app.css">
    <link rel="icon" href="/assets/logo-mark.png">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="/" aria-label="Meetify home"><img src="/assets/logo.png" alt="Meetify" width="106" height="26"></a>
            <nav class="topbar-nav" aria-label="Primary">
                <a class="nav-link" href="/Conf/pages/conf.html" aria-current="page">Conferences</a>
                <a class="nav-link" href="/Conf/pages/conf_join.html">Join a room</a>
                <a class="nav-link" href="/profile/profile.html">Profile</a>
                <a class="nav-link" href="/support/support.html">Support</a>
            </nav>
            <span class="topbar-spacer"></span>
            <span class="topbar-user" id="userName"></span>
            <button class="btn btn-ghost btn-icon btn-sm" id="themeToggleBtn" data-static type="button" aria-label="Switch theme"><svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
        </div>
    </header>

    <main class="container page">
        <div class="page-head">
            <div>
                <h1>Conferences</h1>
            </div>
            <a class="btn btn-primary" href="/Conf/pages/conf_create.html">Create room</a>
        </div>

        <div class="toolbar">
            <div class="tabs filter-tabs" role="tablist">
                <button class="filter-tab active" data-filter="all" type="button">All</button>
                <button class="filter-tab" data-filter="host" type="button">Hosted by me</button>
                <button class="filter-tab" data-filter="participant" type="button">Joined</button>
            </div>
            <input class="input search" type="search" id="searchInput" placeholder="Search conferences" aria-label="Search conferences">
        </div>

        <div id="loadingIndicator" class="panel state">
            <div class="spinner" role="status" aria-label="Loading"></div>
        </div>

        <div id="emptyState" class="panel state" style="display: none;">
            <h3>No conferences found</h3>
            <p>Create a room or join one with its ID.</p>
            <div class="state-actions">
                <a class="btn btn-primary" href="/Conf/pages/conf_create.html">Create room</a>
                <a class="btn" href="/Conf/pages/conf_join.html">Join a room</a>
            </div>
        </div>

        <div id="conferencesList" class="panel conf-list" style="display: none;"></div>

        <div id="pagination" class="pagination" style="display: none;">
            <button id="prevPage" class="btn btn-sm" type="button" disabled>Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextPage" class="btn btn-sm" type="button">Next</button>
        </div>
    </main>

    <div id="editModal" class="dialog-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="editTitle">
        <div class="dialog">
            <form id="editForm">
                <div class="dialog-body">
                    <h2 id="editTitle" style="font-size: var(--text-md);">Edit conference</h2>
                    <input type="hidden" id="editConfId">
                    <div class="field"><label for="editName">Name</label><input class="input" type="text" id="editName" maxlength="100" required></div>
                    <div class="field"><label for="editDescription">Description</label><textarea class="textarea" id="editDescription" rows="3" maxlength="500"></textarea></div>
                    <div class="form-row">
                        <div class="field"><label for="editMaxParticipants">Max participants</label><input class="input" type="number" id="editMaxParticipants" min="2" max="100"></div>
                        <label class="check" style="align-self:end; height: var(--control-h);"><input type="checkbox" id="editIsPublic"> Public conference</label>
                    </div>
                    <div class="form-row">
                        <div class="field"><label for="editStartTime">Start time</label><input class="input" type="datetime-local" id="editStartTime"></div>
                        <div class="field"><label for="editEndTime">End time</label><input class="input" type="datetime-local" id="editEndTime"></div>
                    </div>
                    <label class="check"><input type="checkbox" id="editChangePassword" onchange="togglePasswordField()"> Change password</label>
                    <div class="field" id="editPasswordGroup" style="display:none;">
                        <label for="editPassword">New password</label>
                        <input class="input" type="password" id="editPassword" maxlength="100" placeholder="Leave empty to remove the password">
                    </div>
                </div>
                <div class="dialog-foot">
                    <button type="button" class="btn" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="editSubmitBtn">Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="app-foot">&copy; 2026 Meetify</footer>

    <script src="/js/theme.js"></script>
    <script src="/Conf/js/conf_utils.js"></script>
    <script src="/Conf/js/conf.js"></script>
    <script src="/err/error-logger.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/notifications.js"></script>
</body>
</html>
